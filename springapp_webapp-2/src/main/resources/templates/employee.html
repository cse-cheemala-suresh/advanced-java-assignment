<!DOCTYPE html>
<html xmlns:th = "http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Employee page</title>
</head>
<body>
<table border = "1">
	<tr>
		<th>ID</th>
		<th>Name</th>
		<th>Email</th>
	</tr>
	<tr th:each = "employee : ${employees}">
		<td th:text = "${employee.id}"></td>
		<td th:text = "${employee.name}"></td>
		<td th:text = "${employee.email}"></td>
	</tr>
</table>
</body>
</html>
