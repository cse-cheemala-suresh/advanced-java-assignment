<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>leave Requests</title>
</head>
<body>
<h1>Leave Request Logs</h1>
<table border = "1">
	<tr>
		<th>Request ID</th>
		<th>Employee ID</th>
		<th>Employee Name</th>
		<th>Leave ID</th>
		<th>Leave Name</th>
		<th>Start Date</th>
		<th>End Date</th>
		<th>Status</th>
	</tr>
	<tr th:each="l : ${leaveRequests}">	
		<td th:text="${l.requestId}"></td>
		<td th:text="${l.employee.employeeId}"></td>
		<td th:text="${l.employee.name}"></td>
		<td th:text="${l.leaveType.leaveId}"></td>
		<td th:text="${l.leaveType.leaveName}"></td>
		<td th:text="${l.startDate}"></td>
		<td th:text="${l.endDate}"></td>
		<td th:text="${l.status}"></td>
		<td>
			<a th:href="@{/deleteLeaveRequest/{id}(id=${l.requestId})}"
               onclick="return confirm('Are you sure?')">
				Delete
			</a>
		</td>
	</tr>
</table>
</body>
</html>
